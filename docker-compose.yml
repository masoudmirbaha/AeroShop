name: aeroshop

services:
  postgres:
    image: postgres:17-alpine
    container_name: aeroshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeroshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeroshop}
      POSTGRES_DB: ${POSTGRES_DB:-aeroshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aeroshop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aeroshop-pgdata:
