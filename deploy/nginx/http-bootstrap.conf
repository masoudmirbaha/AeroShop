# BOOTSTRAP ONLY — copied into conf.d when NGINX_MODE=bootstrap.
# Serves ACME HTTP-01; ordinary requests get 503 (no HTTPS redirects, no app proxy).

server_tokens off;

# Unknown Host headers (IP scans, unconfigured names) get the connection closed.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ntopiran.ir www.ntopiran.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "AeroShop TLS bootstrap: HTTP-01 only.\n";
    }
}

# Container healthcheck only; loopback inside the container, not published.
server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /nginx-health {
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
