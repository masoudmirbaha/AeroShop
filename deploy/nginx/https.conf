# AeroShop edge, port 443. Loaded only once the certificate exists (see start-nginx.sh).
# Deployment scope: ntopiran.ir + www.ntopiran.ir (canonical https://ntopiran.ir).

ssl_certificate     /etc/letsencrypt/live/ntopiran.ir/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ntopiran.ir/privkey.pem;

# Mozilla "intermediate" profile.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:aeroshop_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Unknown SNI names are refused.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.ntopiran.ir;
    return 301 https://ntopiran.ir$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ntopiran.ir;

    # Short max-age until the deployment is verified; raise it later.
    add_header Strict-Transport-Security "max-age=86400" always;

    set $aeroshop_web http://web:3000;
    set $aeroshop_api http://api:4000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    client_max_body_size 10m;

    # Same public path the web app's /api rewrite already exposes, sent straight to the API
    # so 100 MB admin uploads and file downloads stream without passing through Next.js.
    location /api/ {
        client_max_body_size 110m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass $aeroshop_api;

        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=aeroshop_auth burst=10 nodelay;
            proxy_pass $aeroshop_api;
        }
    }

    location / {
        proxy_pass $aeroshop_web;
    }
}
