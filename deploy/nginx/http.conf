# AeroShop edge, port 80. Always loaded (see start-nginx.sh).
# Port 80 never serves the app: it answers ACME HTTP-01 challenges and redirects
# everything else to the canonical HTTPS origin, preserving path and query string.

server_tokens off;

# Docker's embedded DNS. Upstreams are proxied through variables so a restarted
# web/api container (new IP) is re-resolved instead of cached until nginx reloads.
resolver 127.0.0.11 valid=10s ipv6=off;

# The API has no login rate limiting of its own; see https.conf.
limit_req_zone $binary_remote_addr zone=aeroshop_auth:10m rate=10r/m;
limit_req_status 429;

# Unknown Host headers (IP scans, unconfigured names) get the connection closed.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ntopiran.ir www.ntopiran.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ntopiran.ir$request_uri;
    }
}

# Container healthcheck only; loopback inside the container, not published.
server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /nginx-health {
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
